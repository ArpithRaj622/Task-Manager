<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <title>Tasks</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body>
    <header>
        <h1>Task Manager</h1>
        
        <div class="header-buttons">
            <!-- light/dark mode toggle -->
            <button aria-label="Toggle theme">
                <i class="fa-regular fa-moon"></i>
            </button>

            <!-- profile -->
            <button aria-label="Profile">
                <i class="fa-regular fa-user"></i>
            </button>

            <!-- mobile menu -->
            <button aria-label="Open menu" class="lg:hidden" id="mobileMenuOpenBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- backdrop -->
    <div class="mobile-menu-backdrop opacity-0 pointer-events-none">
    </div>

    <!-- mobile nav -->
    <nav class="mobile-menu translate-x-full">
        <div class="mobile-nav-header">
            <p>Menu</p>
            <button aria-label="Close mobile menu" id="mobileMenuCloseBtn" class="hover:text-red-600 cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="mobile-nav-links">
            <a href="#">Dashboard</a>
            <a href="#">My Tasks</a>
            <a href="#">Completed</a>
            <a href="#">Categories</a>
        </div>
    </nav>

    <!-- desktop nav -->
    <aside>
        <div class="desktop-nav-menu">
            <a href="#">
                <i class="fa-solid fa-table-columns"></i>Dashboard
            </a>
            <a href="#">
                <i class="fa-regular fa-clipboard"></i>My Tasks
            </a>
            <a href="#">
                <i class="fa-regular fa-square-check"></i>Completed
            </a>
            <a href="#">
                <i class="fa-solid fa-layer-group"></i>Categories
            </a>
        </div>
    </aside>

    <main class="main-content-inTasksPage">
        <!-- edit task modal -->
        <div class="edit-task-modal hidden">
            <!-- header -->
            <div class="header">
                <p>Edit Task</p>
                <button class="form-close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- form -->
            <form action="">
                <!-- title -->
                <div>
                    <label for="edit-task-title">Task Title:</label>
                    <input type="text" id="edit-task-title" name="taskTitle" placeholder="Enter task title">
                </div>
                <!-- description -->
                <div>
                    <label for="edit-task-description">Description:</label>
                    <textarea name="taskDescription" id="edit-task-description" placeholder="Description..."></textarea>
                </div>
                <!-- category -->
                <div>
                    <label for="edit-category">Select Category:</label>
                    <select name="category" id="edit-category">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="study">Study</option>
                    </select>
                </div>
                <!-- priority -->
                <div>
                    <label for="edit-priority">Priority:</label>
                    <select name="priority" id="edit-priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <!-- due date -->
                <div>
                    <label for="edit-due-date">Due date:</label> 
                    <input type="date" name="dueDate" id="edit-due-date">
                </div>
                <!-- status -->
                <div>
                    <label for="edit-task-status">Status:</label>
                    <select name="taskStatus" id="edit-task-status">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <!-- form error message -->
                <div>
                    <p class="edit-form-error hidden">Please fill in all required fields.</p>
                </div>
                <!-- buttons -->
                <div class="form-action-btns">
                    <button type="submit" class="bg-blue-700 hover:bg-blue-600" id="editSave">
                        Save
                    </button>
                    <button type="button" class="bg-red-600 hover:bg-red-500" id="editCancel">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- tasks filter -->
        <div class="tasks-filter">
            <p data-status="all">All Tasks</p>
            <p data-status="pending">Pending</p>
            <p data-status="in-progress">In Progress</p>
            <p data-status="completed">Completed</p>
        </div>

        <!-- tasks container -->
        <div class="tasks-container-inTasksPage">
            <!-- task card -->
        </div>
    </main>

    <script src="./tasks.js" defer></script>
</body>
</html>
