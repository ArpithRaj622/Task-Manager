<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <title>Task Manager</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>
<body>
    <header>
        <h1>Task Manager</h1>
        
        <div class="header-buttons">
            <!-- light/dark mode toggle -->
            <button aria-label="Toggle theme">
                <i class="fa-regular fa-moon"></i>
            </button>

            <!-- profile -->
            <button aria-label="Profile">
                <i class="fa-regular fa-user"></i>
            </button>

            <!-- mobile menu -->
            <button aria-label="Open menu" class="lg:hidden" id="mobileMenuOpenBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- backdrop -->
    <div class="mobile-menu-backdrop opacity-0 pointer-events-none">
    </div>

    <!-- mobile nav -->
    <nav class="mobile-menu translate-x-full">
        <div class="mobile-nav-header">
            <p>Menu</p>
            <button aria-label="Close mobile menu" id="mobileMenuCloseBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="mobile-nav-links">
            <a href="#">Dashboard</a>
            <a href="#">My Tasks</a>
            <a href="#">Completed</a>
            <a href="#">Categories</a>
        </div>
    </nav>

    <!-- desktop nav -->
    <aside>
        <div class="desktop-nav-menu">
            <a href="#">
                <i class="fa-solid fa-table-columns"></i>Dashboard
            </a>
            <a href="#">
                <i class="fa-regular fa-clipboard"></i>My Tasks
            </a>
            <a href="#">
                <i class="fa-regular fa-square-check"></i>Completed
            </a>
            <a href="#">
                <i class="fa-solid fa-layer-group"></i>Categories
            </a>
        </div>
    </aside>

    <!-- main content -->
    <main class="main-content">
        <div class="dashboard-heading">
            <h2>Dashboard</h2>
            <p>Manage your tasks and stay organized</p>
        </div>

        <!-- summary cards -->
        <div class="summary-cards-container">
            <div class="summary-card"> 
                <div class="card-icon-label">
                    <i class="fa-solid fa-list-check"></i>
                    <p class="card-label">Total Tasks</p>
                </div>
                <p class="card-value">12</p>
            </div>
            <div class="summary-card">
                <div class="card-icon-label">
                    <i class="fa-solid fa-clock"></i>
                    <p class="card-label">Pending</p>
                </div>
                <p class="card-value">4</p>
            </div>
            <div class="summary-card">
                <div class="card-icon-label">
                    <i class="fa-solid fa-spinner"></i>
                    <p class="card-label">In Progress</p>
                </div>
                <p class="card-value">3</p>
            </div>
            <div class="summary-card">
                <div class="card-icon-label">
                    <i class="fa-solid fa-circle-check"></i>
                    <p class="card-label">Completed</p>
                </div>
                <p class="card-value">5</p>
            </div>
        </div>
    </main>

    <script src="./src/script.js" defer></script>
</body>
</html>
